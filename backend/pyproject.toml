[project]
name = "financeiq"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=4.3.0",
    "claude-agent-sdk>=0.2.144",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "openai>=3.3.1",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
