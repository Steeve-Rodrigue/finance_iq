name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: financeiq
          POSTGRES_PASSWORD: financeiq
          POSTGRES_DB: financeiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeiq"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://financeiq_app:financeiq_app@localhost:5432/financeiq
      MIGRATION_DATABASE_URL: postgresql+psycopg://financeiq:financeiq@localhost:5432/financeiq
      JWT_SECRET_KEY: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
        working-directory: ./backend
      - run: uv run ruff check .
        working-directory: ./backend
      - run: uv run ruff format --check .
        working-directory: ./backend
      - name: "Create restricted app role (services: containers can't mount initdb scripts)"
        run: |
          PGPASSWORD=financeiq psql -h localhost -U financeiq -d financeiq -v ON_ERROR_STOP=1 <<-EOSQL
              CREATE ROLE financeiq_app WITH LOGIN PASSWORD 'financeiq_app'
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
              GRANT CONNECT ON DATABASE financeiq TO financeiq_app;
              GRANT USAGE ON SCHEMA public TO financeiq_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE financeiq IN SCHEMA public
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO financeiq_app;
          EOSQL
      - run: uv run alembic upgrade head
        working-directory: ./backend
        env:
         OPENAI_API_KEY: test-api-key
      - run: uv run pytest --cov=app
        working-directory: ./backend
