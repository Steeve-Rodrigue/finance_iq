services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes:                #a enlever
      - ./app:/app/app     # en production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeiq}
      POSTGRES_DB: ${POSTGRES_DB:-financeiq}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-financeiq_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-financeiq_app}
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./docker/initdb:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeiq}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    depends_on: ["db"]

volumes:
  pgdata:
